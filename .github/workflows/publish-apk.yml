name: 发布星番屋正式版

on:
  workflow_dispatch:
    inputs:
      version:
        description: "正式版本号，例如 1.0.0"
        required: true
        default: "1.0.0"
        type: string

      artifact_run_id:
        description: "已经测试通过的构建 Run ID"
        required: true
        default: "35162855898"
        type: string

      release_notes:
        description: "更新日志"
        required: true
        default: |
          星番屋 v1.0.0

          首个正式版本。
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 检查正式版本号
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::正式版版本号必须是 X.Y.Z 格式"
            echo "例如：1.0.0"
            echo "正式版不能包含 beta、alpha、rc 等后缀"
            exit 1
          fi

          echo "准备发布正式版：v$VERSION"

      - name: 检查构建运行结果
        shell: bash
        env:
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail

          STATUS="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.status'
          )"

          CONCLUSION="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.conclusion'
          )"

          WORKFLOW_NAME="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.name'
          )"

          HEAD_SHA="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.head_sha'
          )"

          echo "工作流：$WORKFLOW_NAME"
          echo "状态：$STATUS"
          echo "结果：$CONCLUSION"
          echo "源码提交：$HEAD_SHA"

          if [ "$STATUS" != "completed" ]; then
            echo "::error::指定的构建还没有完成"
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::指定的构建没有成功"
            exit 1
          fi

          if [ "$WORKFLOW_NAME" != "星番屋正式签名 APK" ]; then
            echo "::error::指定 Run 不是“星番屋正式签名 APK”工作流"
            exit 1
          fi

          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: 检查目标 Artifact
        shell: bash
        env:
          RUN_ID: ${{ inputs.artifact_run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          ARTIFACT_NAME="XingFanWu-${VERSION}-android-release"

          COUNT="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false)] | length"
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::没有找到唯一可用的 Artifact：$ARTIFACT_NAME"
            exit 1
          fi

          ARTIFACT_ID="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id"
          )"

          ARTIFACT_DIGEST="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .digest"
          )"

          echo "Artifact：$ARTIFACT_NAME"
          echo "Artifact ID：$ARTIFACT_ID"
          echo "Artifact Digest：$ARTIFACT_DIGEST"

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: 下载已经测试的 Artifact
        shell: bash
        env:
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail

          mkdir -p release-artifact

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-artifact

          echo "下载完成："
          find release-artifact -maxdepth 2 -type f -print

      - name: 验证 APK 文件
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          EXPECTED_FILE="XingFanWu-v${VERSION}-release.apk"

          APK="$(
            find release-artifact \
              -type f \
              -name "$EXPECTED_FILE" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "::error::没有找到正式 APK：$EXPECTED_FILE"
            exit 1
          fi

          APK_COUNT="$(
            find release-artifact \
              -type f \
              -name '*.apk' \
              | wc -l
          )"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "::error::Artifact 中 APK 数量不是 1"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "准备发布的 APK："
          ls -lh "$APK"

          echo "APK SHA-256："
          sha256sum "$APK"

      - name: 检查是否已经存在同名 Release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then

            echo "::error::Release $TAG 已经存在"
            echo "为避免误覆盖，工作流已停止。"
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: 写入更新日志
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          printf '%s\n' "$RELEASE_NOTES" > release-notes.md

          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "" >> release-notes.md
          echo "Android 正式签名版本。" >> release-notes.md

      - name: 发布正式版
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "$APK#XingFanWu-v${VERSION}-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "星番屋 v${VERSION}" \
            --notes-file release-notes.md

      - name: 发布结果
        shell: bash
        run: |
          set -euo pipefail

          echo "正式版发布成功。"
          echo "Tag：$TAG"

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY"
