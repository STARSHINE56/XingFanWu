name: 发布星番屋正式版

on:
  workflow_dispatch:
    inputs:
      version:
        description: "正式版本号，例如 1.0.1"
        required: true
        default: "1.0.1"
        type: string

      release_notes:
        description: "更新日志"
        required: true
        default: |
          星番屋 v1.0.1

          修复：
          - 修复已知问题
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 检查版本号
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::正式版版本号必须是 X.Y.Z 格式"
            echo "例如：1.0.1"
            exit 1
          fi

          echo "准备发布：星番屋 v$VERSION"

      - name: 自动查找对应构建
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          WORKFLOW_FILE="build-release-apk.yml"
          ARTIFACT_NAME="XingFanWu-${VERSION}-android-release"

          echo "目标版本：$VERSION"
          echo "目标 Artifact：$ARTIFACT_NAME"

          RUN_ID=""

          RUNS_JSON="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&status=success&per_page=100"
          )"

          while read -r ID; do
            if [ -z "$ID" ]; then
              continue
            fi

            echo "检查 Run ID：$ID"

            COUNT="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${ID}/artifacts" \
                --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false)] | length"
            )"

            if [ "$COUNT" -eq 1 ]; then
              RUN_ID="$ID"
              break
            fi

          done < <(
            echo "$RUNS_JSON" |
              jq -r '.workflow_runs[] | .id'
          )

          if [ -z "$RUN_ID" ]; then
            echo "::error::没有找到版本 $VERSION 对应的成功构建"
            echo "::error::请先运行“星番屋正式签名 APK”工作流"
            exit 1
          fi

          echo "找到对应构建：$RUN_ID"

          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: 检查构建信息
        shell: bash
        run: |
          set -euo pipefail

          STATUS="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.status'
          )"

          CONCLUSION="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.conclusion'
          )"

          WORKFLOW_NAME="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.name'
          )"

          HEAD_SHA="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.head_sha'
          )"

          echo "工作流：$WORKFLOW_NAME"
          echo "Run ID：$RUN_ID"
          echo "状态：$STATUS"
          echo "结果：$CONCLUSION"
          echo "源码提交：$HEAD_SHA"

          if [ "$STATUS" != "completed" ]; then
            echo "::error::构建还没有完成"
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::构建没有成功"
            exit 1
          fi

          if [ "$WORKFLOW_NAME" != "星番屋正式签名 APK" ]; then
            echo "::error::找到的 Run 不是正式签名 APK 工作流"
            exit 1
          fi

          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: 检查 Artifact
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_ID="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | .id" \
              | head -n 1
          )"

          ARTIFACT_DIGEST="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | .digest" \
              | head -n 1
          )"

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::没有找到可用 Artifact"
            exit 1
          fi

          echo "Artifact：$ARTIFACT_NAME"
          echo "Artifact ID：$ARTIFACT_ID"
          echo "Artifact Digest：$ARTIFACT_DIGEST"

      - name: 下载已经构建好的 APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifact

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-artifact

          echo "已下载文件："
          find release-artifact -type f -maxdepth 2 -print

      - name: 验证 APK
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          EXPECTED_FILE="XingFanWu-v${VERSION}-release.apk"

          APK="$(
            find release-artifact \
              -type f \
              -name "$EXPECTED_FILE" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "::error::没有找到 APK：$EXPECTED_FILE"
            exit 1
          fi

          APK_COUNT="$(
            find release-artifact \
              -type f \
              -name '*.apk' \
              | wc -l
          )"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "::error::Artifact 中 APK 数量不是 1"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "准备发布："
          ls -lh "$APK"

          echo "SHA-256："
          sha256sum "$APK"

      - name: 检查 Release 是否已存在
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then

            echo "::error::Release $TAG 已经存在"
            echo "为避免覆盖已有正式版，工作流停止。"
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: 写入更新日志
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          printf '%s\n' "$RELEASE_NOTES" > release-notes.md

          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "" >> release-notes.md
          echo "Android 正式签名版本。" >> release-notes.md

      - name: 发布正式版
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "$APK#XingFanWu-v${VERSION}-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "星番屋 v${VERSION}" \
            --notes-file release-notes.md

      - name: 发布完成
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================="
          echo "星番屋正式版发布成功"
          echo "=============================="
          echo ""
          echo "版本：$TAG"
          echo "构建 Run ID：$RUN_ID"
          echo "Artifact：$ARTIFACT_NAME"
          echo ""

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY"
