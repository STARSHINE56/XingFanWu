name: 星番屋源码维护

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.0.0"
        required: true
        default: "1.0.0"
        type: string

      build_number:
        description: "内部版本号，例如 2"
        required: true
        default: "2"
        type: string

      remove_old_workflows:
        description: "删除旧的上游构建工作流"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  maintenance:
    name: 维护星番屋源码
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查输入
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须是 X.Y.Z 格式，例如 1.0.0"
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number 必须是整数"
            exit 1
          fi

          echo "版本号：$VERSION"
          echo "内部版本号：$BUILD_NUMBER"

      - name: 更新 pubspec.yaml 版本
        shell: python
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          from pathlib import Path
          import os
          import re

          path = Path("pubspec.yaml")

          if not path.exists():
              raise SystemExit("找不到 pubspec.yaml")

          content = path.read_text(encoding="utf-8")

          version = os.environ["VERSION"]
          build_number = os.environ["BUILD_NUMBER"]

          new_content, count = re.subn(
              r"^version:\s*.+$",
              f"version: {version}+{build_number}",
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise SystemExit("无法找到 pubspec.yaml 中的 version")

          path.write_text(
              new_content,
              encoding="utf-8",
          )

          print(f"pubspec.yaml 已更新为 {version}+{build_number}")

      - name: 配置源码正式签名
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("找不到 android/app/build.gradle")

          content = path.read_text(encoding="utf-8")

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("xingchen_release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          '''

          # 删除已有的 signingConfigs.release，避免重复
          content = re.sub(
              r'''
              \n[ \t]*signingConfigs[ \t]*\{
              .*?
              \n[ \t]*\}
              (?=\n[ \t]*(?:buildTypes|defaultConfig|sourceSets|compileOptions|kotlinOptions|flutter|\}))
              ''',
              '\n',
              content,
              count=1,
              flags=re.DOTALL | re.VERBOSE,
          )

          if "android {" not in content:
              raise SystemExit("build.gradle 中找不到 android {")

          content = content.replace(
              "android {",
              "android {\n" + signing_block,
              1,
          )

          # release 必须使用正式签名
          content = content.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release",
          )

          # 如果原本没有 signingConfig，自动添加
          if "signingConfig signingConfigs.release" not in content:
              pattern = r"(buildTypes\s*\{\s*release\s*\{)"

              replacement = (
                  r"\1"
                  "\n            signingConfig signingConfigs.release"
              )

              content, count = re.subn(
                  pattern,
                  replacement,
                  content,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "无法找到 buildTypes release 配置"
                  )

          # 清理上游旧 TODO
          content = content.replace(
              "            // TODO: Add your own signing config for the release build.\n",
              "",
          )

          content = content.replace(
              "            // Signing with the debug keys for now, so `flutter run --release` works.\n",
              "",
          )

          path.write_text(
              content,
              encoding="utf-8",
          )

          print("android/app/build.gradle 已改为正式签名配置")

      - name: 检查正式签名源码
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/app/build.gradle"

          if ! grep -q \
            'signingConfig signingConfigs.release' \
            "$FILE"; then

            echo "::error::release 没有使用正式签名"
            exit 1
          fi

          if grep -q \
            'signingConfig signingConfigs.debug' \
            "$FILE"; then

            echo "::error::仍然检测到 release debug 签名"
            exit 1
          fi

          if ! grep -q \
            'ANDROID_KEYSTORE_PASSWORD' \
            "$FILE"; then

            echo "::error::没有检测到正式签名环境变量"
            exit 1
          fi

          if ! grep -q \
            'ANDROID_KEY_ALIAS' \
            "$FILE"; then

            echo "::error::没有检测到签名 Alias 配置"
            exit 1
          fi

          if ! grep -q \
            'ANDROID_KEY_PASSWORD' \
            "$FILE"; then

            echo "::error::没有检测到 Key 密码配置"
            exit 1
          fi

          echo "正式签名源码检查通过"

      - name: 清理旧工作流
        if: ${{ inputs.remove_old_workflows }}
        shell: bash
        run: |
          set -euo pipefail

          echo "开始检查旧工作流..."

          OLD_WORKFLOWS=(
            ".github/workflows/pr.yaml"
            ".github/workflows/release.yaml"
            ".github/workflows/rebrand-xingfanwu.yml"
          )

          for file in "${OLD_WORKFLOWS[@]}"; do
            if [ -f "$file" ]; then
              echo "删除：$file"
              rm "$file"
            else
              echo "不存在，跳过：$file"
            fi
          done

          echo ""
          echo "保留的星番屋工作流："

          if [ -f ".github/workflows/build-release-apk.yml" ]; then
            echo "✓ build-release-apk.yml"
          else
            echo "::error::缺少 build-release-apk.yml"
            exit 1
          fi

          if [ -f ".github/workflows/publish-apk.yml" ]; then
            echo "✓ publish-apk.yml"
          else
            echo "::error::缺少 publish-apk.yml"
            exit 1
          fi

          echo "✓ maintenance-xingfanwu.yml"

      - name: 检查版本结果
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          EXPECTED="version: ${VERSION}+${BUILD_NUMBER}"

          ACTUAL="$(
            grep '^version:' pubspec.yaml \
              | head -n 1
          )"

          echo "预期：$EXPECTED"
          echo "实际：$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::pubspec.yaml 版本更新失败"
            exit 1
          fi

      - name: 显示修改内容
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Git 状态 =========="
          git status --short

          echo ""
          echo "========== 修改统计 =========="
          git diff --stat

          echo ""
          echo "========== pubspec 版本 =========="
          grep '^version:' pubspec.yaml

          echo ""
          echo "========== Android 签名配置 =========="
          grep -n \
            -E 'signingConfigs|storeFile|ANDROID_KEY|signingConfig' \
            android/app/build.gradle \
            || true

      - name: 检查是否有修改
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有需要提交的修改"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到修改"
          fi

      - name: 提交修改
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            pubspec.yaml \
            android/app/build.gradle \
            .github/workflows

          git commit \
            -m "chore: finalize XingFanWu ${VERSION}+${BUILD_NUMBER}"

          git push origin HEAD:${GITHUB_REF_NAME}

      - name: 完成
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          echo ""
          echo "================================"
          echo "星番屋源码维护完成"
          echo "================================"
          echo ""
          echo "版本：${VERSION}+${BUILD_NUMBER}"
          echo ""
          echo "已完成："
          echo "1. pubspec.yaml 正式版本统一"
          echo "2. Android release 正式签名写入源码"
          echo "3. 旧上游工作流清理"
          echo ""
          echo "保留："
          echo "- build-release-apk.yml"
          echo "- publish-apk.yml"
          echo "- maintenance-xingfanwu.yml"
