name: AniBaka 可见兼容测试 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 验证 AniBaka 工作流
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable

      - name: 下载 AniBaka 规则库
        run: |
          git clone \
            --depth=1 \
            https://github.com/AniBakaBaka/AniBakaRule.git \
            /tmp/AniBakaRule

          echo "AniBaka rules:"
          find /tmp/AniBakaRule \
            -maxdepth 1 \
            -name "*.json" \
            -type f \
            | wc -l

      - name: 安装依赖
        run: flutter pub get

      - name: 构建测试 APK
        run: flutter build apk --debug

      - name: 上传测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: XingFanWu-AniBaka-Workflow-Test
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
