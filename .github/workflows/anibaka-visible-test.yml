name: AniBaka 可见兼容测试 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 AniBaka ARM64 测试版
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: 下载 AniBaka 规则库
        run: |
          git clone --depth=1 \
            https://github.com/AniBakaBaka/AniBakaRule.git \
            /tmp/AniBakaRule

      - name: 应用 AniBaka 测试版修改
        run: python3 tools/anibaka_preview_setup.py

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 ARM64 APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: 准备 APK
        run: |
          cp \
            build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/flutter-apk/XingFanWu-AniBaka-ARM64.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: XingFanWu-AniBaka-ARM64
          path: build/app/outputs/flutter-apk/XingFanWu-AniBaka-ARM64.apk
          if-no-files-found: error
          retention-days: 7
