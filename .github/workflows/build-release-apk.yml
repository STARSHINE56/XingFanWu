name: 星番屋正式签名 APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.0.0"
        required: true
        default: "1.0.0"
        type: string

      build_number:
        description: "内部版本号，例如 1"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  build-release:
    name: 构建正式签名 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: 检查版本号
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式不正确：$APP_VERSION"
            echo "正式版示例：1.0.0"
            echo "测试版示例：1.0.0-beta.1"
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number 必须是整数"
            exit 1
          fi

          echo "版本号：$APP_VERSION"
          echo "内部版本号：$BUILD_NUMBER"

      - name: 检查正式签名配置
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          FAILED=0

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64"
            FAILED=1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_PASSWORD"
            FAILED=1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::缺少 ANDROID_KEY_ALIAS"
            FAILED=1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::缺少 ANDROID_KEY_PASSWORD"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "四个正式签名 Secrets 均已配置。"

      - name: 恢复正式签名文件
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="android/app/xingchen_release.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::JKS 恢复失败或文件为空"
            exit 1
          fi

          echo "JKS 已成功恢复到 Actions 临时环境。"

      - name: 验证签名文件
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore android/app/xingchen_release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "JKS 密码和 Alias 验证成功。"

      - name: 检查 Gradle 签名配置
        shell: bash
        run: |
          set -euo pipefail

          if grep -A12 "release {" android/app/build.gradle \
            | grep -q "signingConfigs.debug"; then
            echo "::error::release 仍然使用 debug 签名"
            exit 1
          fi

          if ! grep -q \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle; then
            echo "::error::没有检测到正式 release signingConfig"
            exit 1
          fi

          if ! grep -q \
            'storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")' \
            android/app/build.gradle; then
            echo "::error::没有检测到正式签名 storePassword 配置"
            exit 1
          fi

          if ! grep -q \
            'keyAlias System.getenv("ANDROID_KEY_ALIAS")' \
            android/app/build.gradle; then
            echo "::error::没有检测到正式签名 keyAlias 配置"
            exit 1
          fi

          if ! grep -q \
            'keyPassword System.getenv("ANDROID_KEY_PASSWORD")' \
            android/app/build.gradle; then
            echo "::error::没有检测到正式签名 keyPassword 配置"
            exit 1
          fi

          echo "Gradle 正式签名配置检查通过。"

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 生成 Android 图标
        run: dart run flutter_launcher_icons

      - name: Flutter 单元测试
        run: flutter test test/xingfanwu_update_test.dart

      - name: Flutter 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 构建正式签名 APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --build-name "${{ inputs.version }}" \
            --build-number "${{ inputs.build_number }}"

      - name: 检查 APK 是否生成
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::没有找到 app-release.apk"
            exit 1
          fi

          echo "APK 构建成功："
          ls -lh "$APK"

      - name: 验证 APK 信息
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$AAPT" ]; then
            echo "::error::找不到 aapt"
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"

          PACKAGE="$(
            echo "$BADGING" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          VERSION="$(
            echo "$BADGING" \
              | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p"
          )"

          echo "applicationId：$PACKAGE"
          echo "versionName：$VERSION"

          if [ "$PACKAGE" != "com.starshine.xingfanwu" ]; then
            echo "::error::applicationId 不正确：$PACKAGE"
            exit 1
          fi

          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::versionName 不正确"
            echo "预期：$EXPECTED_VERSION"
            echo "实际：$VERSION"
            exit 1
          fi

          echo "APK 包名和版本号验证通过。"

      - name: 验证正式签名
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner"
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          EXPECTED_SHA256="$(
            keytool \
              -list \
              -v \
              -keystore android/app/xingchen_release.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
            | sed -n 's/.*SHA256: //p' \
            | head -n 1 \
            | tr -d ' :\r\n' \
            | tr '[:lower:]' '[:upper:]'
          )"

          ACTUAL_SHA256="$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ' :\r\n' \
            | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::无法读取 JKS SHA-256"
            exit 1
          fi

          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::无法读取 APK 签名 SHA-256"
            exit 1
          fi

          echo "JKS 证书 SHA-256："
          echo "$EXPECTED_SHA256"

          echo "APK 签名 SHA-256："
          echo "$ACTUAL_SHA256"

          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::APK 签名和你的 JKS 不一致"
            exit 1
          fi

          echo "正式签名验证成功。"
          echo "APK 确认使用的是你的正式 JKS。"

      - name: 显示签名证书信息
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -keystore android/app/xingchen_release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | grep -E \
              "Alias name:|Owner:|Issuer:|Valid from:|SHA1:|SHA256:" \
            || true

      - name: 重命名 APK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="build/app/outputs/flutter-apk/app-release.apk"

          OUTPUT="build/app/outputs/flutter-apk/XingFanWu-v${{ inputs.version }}-release.apk"

          cp "$SOURCE" "$OUTPUT"

          echo "最终 APK："
          ls -lh "$OUTPUT"

      - name: 计算 APK SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/XingFanWu-v${{ inputs.version }}-release.apk"

          echo "APK SHA-256："
          sha256sum "$APK"

      - name: 上传正式 APK
        uses: actions/upload-artifact@v4
        with:
          name: XingFanWu-${{ inputs.version }}-android-release
          path: build/app/outputs/flutter-apk/XingFanWu-v${{ inputs.version }}-release.apk
          if-no-files-found: error
          retention-days: 30
