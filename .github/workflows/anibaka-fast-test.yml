name: AniBaka 快速测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 快速检查 AniBaka
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: 下载 AniBaka 规则库
        run: |
          git clone --depth=1 \
            https://github.com/AniBakaBaka/AniBakaRule.git \
            /tmp/AniBakaRule

      - name: 生成 AniBaka 测试代码
        run: python3 tools/anibaka_preview_setup.py

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 格式检查
        run: |
          dart format \
            lib/pages/plugin_editor/anibaka_preview_page.dart \
            lib/pages/plugin_editor/plugin_module.dart \
            lib/pages/plugin_editor/plugin_view_page.dart

      - name: 静态检查
        run: |
          flutter analyze \
            lib/pages/plugin_editor/anibaka_preview_page.dart \
            lib/pages/plugin_editor/plugin_module.dart \
            lib/pages/plugin_editor/plugin_view_page.dart \
            --no-fatal-infos

      - name: 检查生成结果
        run: |
          test -f assets/anibaka/manifest.json
          test -f lib/pages/plugin_editor/anibaka_preview_page.dart
          grep -q "anibaka-preview" lib/pages/plugin_editor/plugin_module.dart
          echo "AniBaka 快速检查全部通过"
