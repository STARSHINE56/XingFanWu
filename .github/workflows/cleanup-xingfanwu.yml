name: 星番屋项目收尾优化

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: 完成星番屋收尾优化
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      # ============================================================
      # 1. 保护 Android 正式签名文件
      # ============================================================

      - name: 添加 JKS 防泄露规则
        shell: python
        run: |
          from pathlib import Path

          path = Path(".gitignore")

          if not path.exists():
              raise SystemExit("找不到 .gitignore")

          content = path.read_text(encoding="utf-8")

          block = """
          # Android signing keys
          *.jks
          *.keystore
          android/app/xingchen_release.jks
          """

          block = "\n".join(
              line.strip()
              for line in block.strip().splitlines()
          )

          additions = []

          for line in block.splitlines():
              if line not in content.splitlines():
                  additions.append(line)

          if additions:
              if not content.endswith("\n"):
                  content += "\n"

              content += "\n" + "\n".join(additions) + "\n"

              path.write_text(
                  content,
                  encoding="utf-8",
              )

              print("已加入 JKS / keystore 忽略规则")
          else:
              print("JKS 防泄露规则已经存在，无需重复修改")

      - name: 检查 JKS 忽略规则
        shell: bash
        run: |
          set -euo pipefail

          grep -Fx "*.jks" .gitignore
          grep -Fx "*.keystore" .gitignore
          grep -Fx "android/app/xingchen_release.jks" .gitignore

          echo "JKS 防泄露配置检查通过。"

      # ============================================================
      # 2. 清理 build-release-apk.yml 中已经多余的 Gradle 修改逻辑
      # ============================================================

      - name: 清理构建工作流旧签名修改步骤
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/build-release-apk.yml")

          if not path.exists():
              raise SystemExit(
                  "找不到 .github/workflows/build-release-apk.yml"
              )

          content = path.read_text(encoding="utf-8")

          start_marker = (
              "      - name: 配置 Gradle 正式签名\n"
          )

          end_marker = (
              "      - name: 检查 Gradle 签名配置\n"
          )

          if start_marker in content:
              start = content.index(start_marker)

              if end_marker not in content[start:]:
                  raise SystemExit(
                      "找到了旧签名修改步骤，但没有找到后续签名检查步骤"
                  )

              end = content.index(
                  end_marker,
                  start,
              )

              content = (
                  content[:start]
                  + content[end:]
              )

              print(
                  "已删除构建工作流中多余的 Gradle 签名修改步骤"
              )
          else:
              print(
                  "旧的 Gradle 签名修改步骤已经不存在"
              )

          # 在 flutter analyze 前加入测试步骤
          analyze_marker = (
              "      - name: Flutter 静态检查\n"
          )

          test_block = """      - name: Flutter 单元测试
          run: flutter test test/xingfanwu_update_test.dart

          """

          if (
              "Flutter 单元测试" not in content
              and analyze_marker in content
          ):
              content = content.replace(
                  analyze_marker,
                  test_block + analyze_marker,
                  1,
              )

              print(
                  "已把更新模块测试加入正式 APK 构建流程"
              )
          elif "Flutter 单元测试" in content:
              print(
                  "构建工作流已经包含 Flutter 单元测试"
              )
          else:
              raise SystemExit(
                  "找不到 Flutter 静态检查步骤"
              )

          path.write_text(
              content,
              encoding="utf-8",
          )

      - name: 检查构建工作流
        shell: bash
        run: |
          set -euo pipefail

          if grep -q \
            "name: 配置 Gradle 正式签名" \
            .github/workflows/build-release-apk.yml; then

            echo "::error::旧的 Gradle 临时修改步骤仍然存在"
            exit 1
          fi

          if ! grep -q \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle; then

            echo "::error::源码 build.gradle 没有正式签名配置"
            exit 1
          fi

          if ! grep -q \
            "Flutter 单元测试" \
            .github/workflows/build-release-apk.yml; then

            echo "::error::构建工作流没有加入单元测试"
            exit 1
          fi

          echo "构建工作流清理检查通过。"

      # ============================================================
      # 3. 删除已经完成使命的维护工作流
      # ============================================================

      - name: 删除旧维护工作流
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ".github/workflows/maintenance-xingfanwu.yml" ]; then
            rm ".github/workflows/maintenance-xingfanwu.yml"
            echo "已删除 maintenance-xingfanwu.yml"
          else
            echo "maintenance-xingfanwu.yml 已经不存在"
          fi

          echo ""
          echo "保留的核心工作流："

          if [ ! -f ".github/workflows/build-release-apk.yml" ]; then
            echo "::error::build-release-apk.yml 不存在"
            exit 1
          fi

          if [ ! -f ".github/workflows/publish-apk.yml" ]; then
            echo "::error::publish-apk.yml 不存在"
            exit 1
          fi

          echo "✓ 星番屋正式签名 APK"
          echo "✓ 发布星番屋正式版"

      # ============================================================
      # 4. 添加版本比较 + APK 更新匹配测试
      # ============================================================

      - name: 创建更新模块测试
        shell: bash
        run: |
          set -euo pipefail

          cat > test/xingfanwu_update_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:kazumi/services/update/auto_updater.dart';
          import 'package:kazumi/utils/version.dart';

          void main() {
            group('星番屋版本比较', () {
              test('GitHub v 前缀的新版本能够正常识别', () {
                expect(
                  needUpdate('1.0.0', 'v1.0.1'),
                  isTrue,
                );
              });

              test('相同版本不提示更新', () {
                expect(
                  needUpdate('1.0.1', 'v1.0.1'),
                  isFalse,
                );
              });

              test('本地版本更高不提示更新', () {
                expect(
                  needUpdate('1.0.2', 'v1.0.1'),
                  isFalse,
                );
              });

              test('本地 build metadata 不影响版本比较', () {
                expect(
                  needUpdate('1.0.1+5', 'v1.0.2'),
                  isTrue,
                );
              });

              test('预发布后缀不会造成解析异常', () {
                expect(
                  needUpdate('1.0.1-beta.1', 'v1.0.2'),
                  isTrue,
                );
              });
            });

            group('星番屋 Android APK 匹配', () {
              test('能够识别 XingFanWu 正式 APK', () {
                final assets = <dynamic>[
                  <String, dynamic>{
                    'name': 'source-code.zip',
                    'browser_download_url':
                        'https://example.com/source-code.zip',
                  },
                  <String, dynamic>{
                    'name': 'XingFanWu-v1.0.2-release.apk',
                    'browser_download_url':
                        'https://example.com/XingFanWu-v1.0.2-release.apk',
                  },
                ];

                final asset = getUpdateAssetForType(
                  assets,
                  InstallationType.androidApk,
                );

                expect(asset, isNotNull);
                expect(
                  asset!['name'],
                  'XingFanWu-v1.0.2-release.apk',
                );
              });

              test('没有 APK 时返回 null', () {
                final assets = <dynamic>[
                  <String, dynamic>{
                    'name': 'source-code.zip',
                    'browser_download_url':
                        'https://example.com/source-code.zip',
                  },
                ];

                final asset = getUpdateAssetForType(
                  assets,
                  InstallationType.androidApk,
                );

                expect(asset, isNull);
              });

              test('APK 下载链接能够正确读取', () {
                final asset = <String, dynamic>{
                  'name': 'XingFanWu-v1.0.2-release.apk',
                  'browser_download_url':
                      'https://example.com/XingFanWu-v1.0.2-release.apk',
                };

                expect(
                  getUpdateDownloadUrlFromAsset(asset),
                  'https://example.com/XingFanWu-v1.0.2-release.apk',
                );
              });

              test('SHA256 digest 能够正确解析', () {
                final asset = <String, dynamic>{
                  'digest': 'sha256:1234567890abcdef',
                };

                expect(
                  getUpdateFileHashFromAsset(asset),
                  '1234567890abcdef',
                );
              });

              test('Android 更新规则只要求 APK 扩展名', () {
                expect(
                  getUpdateFilePatterns(
                    InstallationType.androidApk,
                  ),
                  ['.apk'],
                );
              });
            });
          }
          EOF

          echo "已创建 test/xingfanwu_update_test.dart"

      - name: 检查更新源码
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q \
            "return \['.apk'\];" \
            lib/services/update/auto_updater.dart; then

            echo "::error::Android APK 更新匹配规则不是预期值"
            exit 1
          fi

          if ! grep -q \
            "_normalizeVersion" \
            lib/utils/version.dart; then

            echo "::error::版本号标准化逻辑不存在"
            exit 1
          fi

          echo "更新源码检查通过。"

      # ============================================================
      # 实际验证
      # ============================================================

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 运行新增更新测试
        run: flutter test test/xingfanwu_update_test.dart

      - name: Flutter 静态检查
        run: flutter analyze --no-fatal-infos

      # ============================================================
      # 最终检查
      # ============================================================

      - name: 显示本次修改
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "========== Git 状态 =========="
          git status --short

          echo ""
          echo "========== 修改统计 =========="
          git diff --stat

          echo ""
          echo "========== 当前工作流 =========="
          find .github/workflows \
            -maxdepth 1 \
            -type f \
            -name '*.yml' \
            -print \
            | sort

      - name: 最终安全检查
        shell: bash
        run: |
          set -euo pipefail

          echo "检查 JKS 是否被提交..."

          if git ls-files | grep -E '\.(jks|keystore)$'; then
            echo "::error::仓库中发现已被 Git 跟踪的签名文件"
            exit 1
          fi

          echo "检查正式签名源码..."

          grep -q \
            'storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")' \
            android/app/build.gradle

          grep -q \
            'keyAlias System.getenv("ANDROID_KEY_ALIAS")' \
            android/app/build.gradle

          grep -q \
            'keyPassword System.getenv("ANDROID_KEY_PASSWORD")' \
            android/app/build.gradle

          grep -q \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "最终安全检查通过。"

      # ============================================================
      # 删除这个一次性工作流自己
      # ============================================================

      - name: 删除一次性收尾工作流
        shell: bash
        run: |
          set -euo pipefail

          rm -f ".github/workflows/cleanup-xingfanwu.yml"

          echo "本工作流完成后将从仓库中自动删除。"

      # ============================================================
      # 提交
      # ============================================================

      - name: 检查是否有修改
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && \
             git diff --cached --quiet && \
             [ -z "$(git status --porcelain)" ]; then

            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有需要提交的修改。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到修改。"
          fi

      - name: 提交优化结果
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m \
            "chore: finalize XingFanWu project cleanup"

          git push origin HEAD:main

      - name: 完成
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "星番屋收尾优化完成"
          echo "======================================"
          echo ""
          echo "已完成："
          echo "1. JKS / keystore 防泄露保护"
          echo "2. 清理构建工作流重复签名修改逻辑"
          echo "3. 删除旧的源码维护工作流"
          echo "4. 添加版本比较和 APK 更新测试"
          echo ""
          echo "同时："
          echo "- 正式 APK 构建会自动运行更新测试"
          echo "- 本次一次性优化工作流会自动删除自己"
          echo ""
          echo "最终日常只需要："
          echo "① 星番屋正式签名 APK"
          echo "② 发布星番屋正式版"
