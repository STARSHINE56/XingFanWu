name: AniBaka 可见兼容测试 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-anibaka:
    name: 构建 AniBaka 可见测试版
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 检出星番屋源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: 下载 AniBaka 规则库
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/AniBakaRule

          git clone \
            --depth=1 \
            https://github.com/AniBakaBaka/AniBakaRule.git \
            /tmp/AniBakaRule

          echo "AniBaka 规则库下载完成"

          find \
            /tmp/AniBakaRule \
            -maxdepth 1 \
            -name '*.json' \
            -type f \
            | sort

      - name: 创建 AniBaka 资源目录
        shell: bash
        run: |
          set -euo pipefail

          rm -rf assets/anibaka

          mkdir -p assets/anibaka/rules

          cp \
            /tmp/AniBakaRule/*.json \
            assets/anibaka/rules/

          echo "AniBaka JSON 已复制"

      - name: 生成星番屋 AniBaka 索引
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          source = Path("/tmp/AniBakaRule")
          output = Path("assets/anibaka")

          rules = []
          operations = Counter()

          def walk_ops(value):
              if isinstance(value, dict):
                  op = value.get("op")

                  if isinstance(op, str):
                      operations[op] += 1

                  for child in value.values():
                      walk_ops(child)

              elif isinstance(value, list):
                  for child in value:
                      walk_ops(child)

          def find_first_search_request(value):
              if isinstance(value, dict):
                  op = value.get("op")

                  if op in {
                      "fetch",
                      "maccmsSuggest",
                      "anime1Search",
                  }:
                      url = value.get("url")

                      if isinstance(url, str):
                          return {
                              "op": str(op),
                              "url": url,
                              "method": str(
                                  value.get(
                                      "method",
                                      "GET",
                                  )
                              ).upper(),
                          }

                  for child in value.values():
                      found = find_first_search_request(
                          child
                      )

                      if found:
                          return found

              elif isinstance(value, list):
                  for child in value:
                      found = find_first_search_request(
                          child
                      )

                      if found:
                          return found

              return None

          for path in sorted(source.glob("*.json")):
              if path.name == "index.json":
                  continue

              try:
                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      f"跳过 JSON 错误: "
                      f"{path.name}: {exc}"
                  )
                  continue

              if not isinstance(data, dict):
                  continue

              if data.get("format") != "anx-rule/2":
                  continue

              walk_ops(data)

              search_request = (
                  find_first_search_request(
                      data.get("search", [])
                  )
              )

              rule = {
                  "id": str(
                      data.get(
                          "id",
                          path.stem,
                      )
                  ),
                  "name": str(
                      data.get(
                          "name",
                          path.stem,
                      )
                  ),
                  "baseUrl": str(
                      data.get(
                          "baseUrl",
                          "",
                      )
                  ),
                  "description": str(
                      data.get(
                          "description",
                          "",
                      )
                  ),
                  "iconUrl": str(
                      data.get(
                          "iconUrl",
                          "",
                      )
                  ),
                  "file": path.name,
                  "searchRequest":
                      search_request,
              }

              rules.append(rule)

          manifest = {
              "format":
                  "xingfanwu-anibaka-preview/2",
              "ruleCount": len(rules),
              "rules": rules,
              "operations": dict(
                  sorted(
                      operations.items()
                  )
              ),
          }

          output.mkdir(
              parents=True,
              exist_ok=True,
          )

          (
              output /
              "manifest.json"
          ).write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print()
          print("============================")
          print("AniBaka 规则索引")
          print("============================")
          print(
              f"规则数量: {len(rules)}"
          )

          for rule in rules:
              search = rule["searchRequest"]

              if search:
                  search_text = (
                      f"{search['op']} "
                      f"{search['url']}"
                  )
              else:
                  search_text = "无基础搜索请求"

              print(
                  f"- {rule['name']} | "
                  f"{search_text}"
              )

          print()
          print("操作符统计：")

          for op, count in sorted(
              operations.items()
          ):
              print(
                  f"- {op}: {count}"
              )
          PY

      - name: 修改 pubspec 加入 AniBaka assets
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")

          text = path.read_text(
              encoding="utf-8"
          )

          line = (
              "    - assets/anibaka/\n"
          )

          if line in text:
              print(
                  "AniBaka assets 已存在"
              )
              raise SystemExit(0)

          marker = "  assets:\n"

          if marker not in text:
              raise SystemExit(
                  "没有找到 flutter/assets"
              )

          pos = text.index(marker)

          insert_at = (
              pos + len(marker)
          )

          text = (
              text[:insert_at]
              + line
              + text[insert_at:]
          )

          path.write_text(
              text,
              encoding="utf-8",
          )

          print(
              "已加入 assets/anibaka/"
          )
          PY

      - name: 创建 AniBaka 规则模型
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            lib/modules/anibaka

          cat > \
            lib/modules/anibaka/anibaka_rule.dart \
            <<'DART'
          class AniBakaSearchRequest {
            const AniBakaSearchRequest({
              required this.op,
              required this.url,
              required this.method,
            });

            final String op;
            final String url;
            final String method;

            factory AniBakaSearchRequest.fromJson(
              Map<String, dynamic> json,
            ) {
              return AniBakaSearchRequest(
                op:
                    json['op']?.toString() ??
                    '',
                url:
                    json['url']?.toString() ??
                    '',
                method:
                    json['method']
                            ?.toString()
                            .toUpperCase() ??
                        'GET',
              );
            }
          }

          class AniBakaRule {
            const AniBakaRule({
              required this.id,
              required this.name,
              required this.baseUrl,
              required this.description,
              required this.iconUrl,
              required this.file,
              required this.searchRequest,
            });

            final String id;
            final String name;
            final String baseUrl;
            final String description;
            final String iconUrl;
            final String file;
            final AniBakaSearchRequest?
                searchRequest;

            factory AniBakaRule.fromJson(
              Map<String, dynamic> json,
            ) {
              final searchRaw =
                  json['searchRequest'];

              return AniBakaRule(
                id:
                    json['id']?.toString() ??
                    '',
                name:
                    json['name']
                            ?.toString() ??
                        '',
                baseUrl:
                    json['baseUrl']
                            ?.toString() ??
                        '',
                description:
                    json['description']
                            ?.toString() ??
                        '',
                iconUrl:
                    json['iconUrl']
                            ?.toString() ??
                        '',
                file:
                    json['file']
                            ?.toString() ??
                        '',
                searchRequest:
                    searchRaw
                            is Map<String,
                                dynamic>
                        ? AniBakaSearchRequest
                            .fromJson(
                            searchRaw,
                          )
                        : null,
              );
            }
          }

          class AniBakaManifest {
            const AniBakaManifest({
              required this.rules,
              required this.operations,
            });

            final List<AniBakaRule> rules;
            final Map<String, int>
                operations;

            factory AniBakaManifest.fromJson(
              Map<String, dynamic> json,
            ) {
              final rulesRaw =
                  json['rules'];

              final operationsRaw =
                  json['operations'];

              final rules =
                  <AniBakaRule>[];

              if (rulesRaw is List) {
                for (final item
                    in rulesRaw) {
                  if (item
                      is Map<String,
                          dynamic>) {
                    rules.add(
                      AniBakaRule.fromJson(
                        item,
                      ),
                    );
                  }
                }
              }

              final operations =
                  <String, int>{};

              if (operationsRaw is Map) {
                for (final entry
                    in operationsRaw
                        .entries) {
                  final value =
                      entry.value;

                  if (value is num) {
                    operations[
                        entry.key
                            .toString()] =
                        value.toInt();
                  }
                }
              }

              return AniBakaManifest(
                rules: rules,
                operations: operations,
              );
            }
          }
          DART

      - name: 创建 AniBaka 加载器
        shell: bash
        run: |
          set -euo pipefail

          cat > \
            lib/modules/anibaka/anibaka_loader.dart \
            <<'DART'
          import 'dart:convert';

          import 'package:flutter/services.dart';

          import 'anibaka_rule.dart';

          class AniBakaLoader {
            const AniBakaLoader();

            Future<AniBakaManifest>
                loadManifest() async {
              final raw =
                  await rootBundle
                      .loadString(
                'assets/anibaka/manifest.json',
              );

              final decoded =
                  jsonDecode(raw);

              if (decoded
                  is! Map<String, dynamic>) {
                throw const FormatException(
                  'AniBaka 索引格式错误',
                );
              }

              return AniBakaManifest
                  .fromJson(
                decoded,
              );
            }

            Future<Map<String, dynamic>>
                loadRawRule(
              AniBakaRule rule,
            ) async {
              final raw =
                  await rootBundle
                      .loadString(
                'assets/anibaka/rules/${rule.file}',
              );

              final decoded =
                  jsonDecode(raw);

              if (decoded
                  is! Map<String, dynamic>) {
                throw const FormatException(
                  'AniBaka 规则格式错误',
                );
              }

              return decoded;
            }
          }
          DART

      - name: 创建 AniBaka 搜索接口测试器
        shell: bash
        run: |
          set -euo pipefail

          cat > \
            lib/modules/anibaka/anibaka_probe.dart \
            <<'DART'
          import 'dart:convert';
          import 'dart:io';

          import 'anibaka_rule.dart';

          class AniBakaProbeResult {
            const AniBakaProbeResult({
              required this.success,
              required this.statusCode,
              required this.url,
              required this.bytes,
              required this.preview,
              required this.message,
            });

            final bool success;
            final int? statusCode;
            final String url;
            final int bytes;
            final String preview;
            final String message;
          }

          class AniBakaProbe {
            AniBakaProbe({
              HttpClient? client,
            }) : _client =
                    client ??
                    HttpClient();

            final HttpClient _client;

            String _replaceKeyword(
              String input,
              String keyword,
            ) {
              final encoded =
                  Uri.encodeComponent(
                keyword,
              );

              return input
                  .replaceAll(
                    '{keyword}',
                    encoded,
                  )
                  .replaceAll(
                    '{keyword:raw}',
                    keyword,
                  )
                  .replaceAll(
                    '@keyword',
                    encoded,
                  );
            }

            String _resolveUrl(
              String baseUrl,
              String searchUrl,
            ) {
              final absolute =
                  Uri.tryParse(
                searchUrl,
              );

              if (absolute != null &&
                  absolute.hasScheme) {
                return absolute
                    .toString();
              }

              final base =
                  Uri.tryParse(
                baseUrl,
              );

              if (base == null ||
                  !base.hasScheme) {
                return searchUrl;
              }

              return base
                  .resolve(searchUrl)
                  .toString();
            }

            Future<AniBakaProbeResult>
                testSearch({
              required AniBakaRule rule,
              required String keyword,
            }) async {
              final requestInfo =
                  rule.searchRequest;

              if (requestInfo == null ||
                  requestInfo.url.isEmpty) {
                return AniBakaProbeResult(
                  success: false,
                  statusCode: null,
                  url: '',
                  bytes: 0,
                  preview: '',
                  message:
                      '该规则没有可直接测试的基础搜索请求',
                );
              }

              final replaced =
                  _replaceKeyword(
                requestInfo.url,
                keyword,
              );

              final url =
                  _resolveUrl(
                rule.baseUrl,
                replaced,
              );

              final uri =
                  Uri.tryParse(url);

              if (uri == null ||
                  !uri.hasScheme) {
                return AniBakaProbeResult(
                  success: false,
                  statusCode: null,
                  url: url,
                  bytes: 0,
                  preview: '',
                  message:
                      '搜索地址无效',
                );
              }

              try {
                _client
                    .connectionTimeout =
                    const Duration(
                  seconds: 12,
                );

                final HttpClientRequest
                    request;

                if (requestInfo.method ==
                    'POST') {
                  request =
                      await _client
                          .postUrl(uri);
                } else {
                  request =
                      await _client
                          .getUrl(uri);
                }

                request.headers.set(
                  HttpHeaders
                      .userAgentHeader,
                  'Mozilla/5.0 '
                  '(Linux; Android 16) '
                  'AppleWebKit/537.36 '
                  'Chrome/126.0 '
                  'Mobile Safari/537.36',
                );

                if (rule.baseUrl
                    .isNotEmpty) {
                  request.headers.set(
                    HttpHeaders
                        .refererHeader,
                    rule.baseUrl,
                  );
                }

                request.headers.set(
                  HttpHeaders
                      .acceptHeader,
                  '*/*',
                );

                final response =
                    await request
                        .close()
                        .timeout(
                  const Duration(
                    seconds: 15,
                  ),
                );

                final bytes =
                    await response
                        .fold<List<int>>(
                  <int>[],
                  (
                    previous,
                    element,
                  ) =>
                      previous
                        ..addAll(element),
                ).timeout(
                  const Duration(
                    seconds: 15,
                  ),
                );

                String text;

                try {
                  text =
                      utf8.decode(
                    bytes,
                    allowMalformed:
                        true,
                  );
                } catch (_) {
                  text = '';
                }

                final cleaned =
                    text
                        .replaceAll(
                          RegExp(
                            r'\s+',
                          ),
                          ' ',
                        )
                        .trim();

                final preview =
                    cleaned.length >
                            350
                        ? cleaned
                            .substring(
                              0,
                              350,
                            )
                        : cleaned;

                final success =
                    response
                                .statusCode >=
                            200 &&
                        response
                                .statusCode <
                            400;

                return AniBakaProbeResult(
                  success: success,
                  statusCode:
                      response
                          .statusCode,
                  url: url,
                  bytes:
                      bytes.length,
                  preview:
                      preview,
                  message: success
                      ? '接口请求成功'
                      : '服务器返回 HTTP '
                          '${response.statusCode}',
                );
              } catch (error) {
                return AniBakaProbeResult(
                  success: false,
                  statusCode: null,
                  url: url,
                  bytes: 0,
                  preview: '',
                  message:
                      '请求失败：$error',
                );
              }
            }

            void close() {
              _client.close(
                force: true,
              );
            }
          }
          DART

      - name: 创建 AniBaka 可见测试页面
        shell: bash
        run: |
          set -euo pipefail

          cat > \
            lib/pages/plugin_editor/anibaka_preview_page.dart \
            <<'DART'
          import 'dart:async';
          import 'dart:convert';

          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:kazumi/bean/settings/settings_detail_scaffold.dart';
          import 'package:kazumi/modules/anibaka/anibaka_loader.dart';
          import 'package:kazumi/modules/anibaka/anibaka_probe.dart';
          import 'package:kazumi/modules/anibaka/anibaka_rule.dart';

          class AniBakaPreviewPage
              extends StatefulWidget {
            const AniBakaPreviewPage({
              super.key,
            });

            @override
            State<AniBakaPreviewPage>
                createState() =>
                    _AniBakaPreviewPageState();
          }

          class _AniBakaPreviewPageState
              extends State<
                  AniBakaPreviewPage> {
            final _filter =
                TextEditingController();

            final _keyword =
                TextEditingController(
              text: '葬送的芙莉莲',
            );

            final _loader =
                const AniBakaLoader();

            late final AniBakaProbe
                _probe;

            AniBakaManifest?
                _manifest;

            String?
                _error;

            String?
                _testingId;

            @override
            void initState() {
              super.initState();

              _probe =
                  AniBakaProbe();

              unawaited(
                _load(),
              );
            }

            @override
            void dispose() {
              _filter.dispose();
              _keyword.dispose();
              _probe.close();
              super.dispose();
            }

            Future<void> _load() async {
              try {
                final manifest =
                    await _loader
                        .loadManifest();

                if (!mounted) {
                  return;
                }

                setState(() {
                  _manifest =
                      manifest;
                  _error = null;
                });
              } catch (error) {
                if (!mounted) {
                  return;
                }

                setState(() {
                  _error =
                      error.toString();
                });
              }
            }

            List<AniBakaRule>
                get _visibleRules {
              final manifest =
                  _manifest;

              if (manifest == null) {
                return const [];
              }

              final query =
                  _filter.text
                      .trim()
                      .toLowerCase();

              if (query.isEmpty) {
                return manifest.rules;
              }

              return manifest.rules
                  .where(
                    (rule) =>
                        rule.name
                            .toLowerCase()
                            .contains(
                              query,
                            ) ||
                        rule.id
                            .toLowerCase()
                            .contains(
                              query,
                            ) ||
                        rule.baseUrl
                            .toLowerCase()
                            .contains(
                              query,
                            ),
                  )
                  .toList();
            }

            Future<void>
                _showRawRule(
              AniBakaRule rule,
            ) async {
              try {
                final raw =
                    await _loader
                        .loadRawRule(
                  rule,
                );

                final pretty =
                    const JsonEncoder
                        .withIndent(
                          '  ',
                        )
                        .convert(
                          raw,
                        );

                if (!mounted) {
                  return;
                }

                await showDialog<void>(
                  context: context,
                  builder:
                      (dialogContext) =>
                          AlertDialog(
                    title: Text(
                      rule.name,
                    ),
                    content:
                        SizedBox(
                      width: 700,
                      child:
                          SingleChildScrollView(
                        child:
                            SelectableText(
                          pretty,
                        ),
                      ),
                    ),
                    actions: [
                      TextButton.icon(
                        onPressed:
                            () async {
                          await Clipboard
                              .setData(
                            ClipboardData(
                              text:
                                  pretty,
                            ),
                          );

                          if (!dialogContext
                              .mounted) {
                            return;
                          }

                          ScaffoldMessenger
                              .of(
                            dialogContext,
                          ).showSnackBar(
                            const SnackBar(
                              content:
                                  Text(
                                '已复制规则 JSON',
                              ),
                            ),
                          );
                        },
                        icon:
                            const Icon(
                          Icons
                              .content_copy_rounded,
                        ),
                        label:
                            const Text(
                          '复制',
                        ),
                      ),
                      FilledButton(
                        onPressed: () =>
                            Navigator.of(
                              dialogContext,
                            ).pop(),
                        child:
                            const Text(
                          '关闭',
                        ),
                      ),
                    ],
                  ),
                );
              } catch (error) {
                if (!mounted) {
                  return;
                }

                _showMessage(
                  '读取规则失败：$error',
                );
              }
            }

            Future<void>
                _testSearch(
              AniBakaRule rule,
            ) async {
              if (_testingId != null) {
                return;
              }

              final keyword =
                  _keyword.text
                      .trim();

              if (keyword.isEmpty) {
                _showMessage(
                  '请先输入测试关键词',
                );
                return;
              }

              setState(() {
                _testingId =
                    rule.id;
              });

              final result =
                  await _probe
                      .testSearch(
                rule: rule,
                keyword: keyword,
              );

              if (!mounted) {
                return;
              }

              setState(() {
                _testingId =
                    null;
              });

              await showDialog<void>(
                context: context,
                builder:
                    (dialogContext) =>
                        AlertDialog(
                  title: Text(
                    '${rule.name} · 搜索测试',
                  ),
                  content:
                      SingleChildScrollView(
                    child:
                        SelectableText(
                      [
                        '状态：'
                            '${result.success ? "成功" : "失败"}',
                        if (result
                                .statusCode !=
                            null)
                          'HTTP：'
                              '${result.statusCode}',
                        if (result
                            .url
                            .isNotEmpty)
                          '地址：'
                              '${result.url}',
                        '响应大小：'
                            '${result.bytes} bytes',
                        '结果：'
                            '${result.message}',
                        if (result
                            .preview
                            .isNotEmpty)
                          '',
                        if (result
                            .preview
                            .isNotEmpty)
                          '响应预览：',
                        if (result
                            .preview
                            .isNotEmpty)
                          result.preview,
                      ].join(
                        '\n',
                      ),
                    ),
                  ),
                  actions: [
                    FilledButton(
                      onPressed: () =>
                          Navigator.of(
                            dialogContext,
                          ).pop(),
                      child:
                          const Text(
                        '确定',
                      ),
                    ),
                  ],
                ),
              );
            }

            void _showMessage(
              String message,
            ) {
              ScaffoldMessenger
                  .of(context)
                  .showSnackBar(
                SnackBar(
                  content:
                      Text(message),
                ),
              );
            }

            void _showOperations() {
              final manifest =
                  _manifest;

              if (manifest == null) {
                return;
              }

              final entries =
                  manifest.operations
                      .entries
                      .toList()
                    ..sort(
                      (a, b) =>
                          b.value
                              .compareTo(
                            a.value,
                          ),
                    );

              showDialog<void>(
                context: context,
                builder:
                    (dialogContext) =>
                        AlertDialog(
                  title:
                      const Text(
                    'AniBaka 操作符统计',
                  ),
                  content:
                      SizedBox(
                    width: 500,
                    child:
                        SingleChildScrollView(
                      child:
                          SelectableText(
                        entries
                            .map(
                              (entry) =>
                                  '${entry.key}: '
                                  '${entry.value}',
                            )
