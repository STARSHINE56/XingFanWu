      - name: 给规则模块增加 AniBaka 路由
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "lib/pages/plugin_editor/plugin_module.dart"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          import_line = (
              "import "
              "'package:kazumi/pages/plugin_editor/"
              "anibaka_preview_page.dart';\n"
          )

          if import_line not in text:
              marker = (
                  "import "
                  "'package:flutter_modular/"
                  "flutter_modular.dart';\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "找不到 plugin_module "
                      "导入位置"
                  )

              text = text.replace(
                  marker,
                  marker + import_line,
                  1,
              )

          route_marker = """      ..route(
        '/shop',
"""

          route_code = """      ..route(
        '/anibaka-preview',
        child: (context, state) =>
            const AniBakaPreviewPage(),
      )
      ..route(
        '/shop',
"""

          if (
              "'/anibaka-preview'"
              not in text
          ):
              if route_marker not in text:
                  raise SystemExit(
                      "找不到 /shop 路由，"
                      "停止修改"
                  )

              text = text.replace(
                  route_marker,
                  route_code,
                  1,
              )

          path.write_text(
              text,
              encoding="utf-8",
          )

          print(
              "AniBaka 路由添加完成"
          )
          PY

      - name: 在规则管理加入 AniBaka 测试按钮
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "lib/pages/plugin_editor/"
              "plugin_view_page.dart"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          if (
              "'AniBaka 测试'"
              in text
          ):
              print(
                  "AniBaka 按钮已存在"
              )
              raise SystemExit(0)

          marker = """                            FilledButton.tonalIcon(
                                style: FilledButton.styleFrom(
                                    minimumSize: const Size(120, 48)),
                                onPressed: () =>
                                    context.pushNamed('/settings/plugin/shop'),
                                icon: const Icon(Icons.travel_explore_rounded),
                                label: const Text('规则仓库')),
"""

          replacement = """                            FilledButton.tonalIcon(
                                style: FilledButton.styleFrom(
                                    minimumSize: const Size(120, 48)),
                                onPressed: () =>
                                    context.pushNamed('/settings/plugin/shop'),
                                icon: const Icon(Icons.travel_explore_rounded),
                                label: const Text('规则仓库')),
                            FilledButton.tonalIcon(
                                style: FilledButton.styleFrom(
                                    minimumSize: const Size(120, 48)),
                                onPressed: () => context.pushNamed(
                                    '/settings/plugin/anibaka-preview'),
                                icon: const Icon(Icons.science_rounded),
                                label: const Text('AniBaka 测试')),
"""

          if marker not in text:
              raise SystemExit(
                  "没有找到规则仓库按钮，"
                  "停止修改避免破坏页面"
              )

          text = text.replace(
              marker,
              replacement,
              1,
          )

          path.write_text(
              text,
              encoding="utf-8",
          )

          print(
              "规则管理页已加入 "
              "AniBaka 测试按钮"
          )
          PY

      - name: 创建 AniBaka 单元测试
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            test/anibaka

          cat > \
            test/anibaka/anibaka_preview_test.dart \
            <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:kazumi/modules/anibaka/anibaka_rule.dart';

          void main() {
            test(
              'parse AniBaka preview manifest',
              () {
                final manifest =
                    AniBakaManifest.fromJson(
                  {
                    'rules': [
                      {
                        'id':
                            'demo',
                        'name':
                            'Demo',
                        'baseUrl':
                            'https://example.com',
                        'description':
                            'test',
                        'iconUrl':
                            '',
                        'file':
                            'demo.json',
                        'searchRequest':
                            {
                          'op':
                              'fetch',
                          'url':
                              '/search?q={keyword}',
                          'method':
                              'GET',
                        },
                      },
                    ],
                    'operations': {
                      'fetch':
                          1,
                    },
                  },
                );

                expect(
                  manifest.rules.length,
                  1,
                );

                expect(
                  manifest.rules.first
                      .name,
                  'Demo',
                );

                expect(
                  manifest
                      .rules
                      .first
                      .searchRequest
                      ?.op,
                  'fetch',
                );

                expect(
                  manifest.operations[
                      'fetch'],
                  1,
                );
              },
            );
          }
          DART

      - name: 安装 Flutter 依赖
        run: |
          flutter pub get

      - name: 格式化 AniBaka 新增代码
        run: |
          dart format \
            lib/modules/anibaka \
            lib/pages/plugin_editor/anibaka_preview_page.dart \
            lib/pages/plugin_editor/plugin_module.dart \
            lib/pages/plugin_editor/plugin_view_page.dart \
            test/anibaka

      - name: 运行 AniBaka 单元测试
        run: |
          flutter test \
            test/anibaka

      - name: 静态检查 AniBaka 代码
        run: |
          flutter analyze \
            lib/modules/anibaka \
            lib/pages/plugin_editor/anibaka_preview_page.dart \
            lib/pages/plugin_editor/plugin_module.dart \
            lib/pages/plugin_editor/plugin_view_page.dart \
            test/anibaka \
            --no-fatal-infos

      - name: 检查 AniBaka 页面是否接入
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            "AniBaka 测试" \
            lib/pages/plugin_editor/plugin_view_page.dart

          grep -q \
            "anibaka-preview" \
            lib/pages/plugin_editor/plugin_module.dart

          test -f \
            assets/anibaka/manifest.json

          echo "AniBaka 页面接入检查通过"

      - name: 构建 AniBaka 可见测试 APK
        run: |
          flutter build apk \
            --debug

      - name: 准备 APK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="build/app/outputs/flutter-apk/app-debug.apk"

          OUTPUT_APK="build/app/outputs/flutter-apk/XingFanWu-AniBaka-Visible-Preview.apk"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::没有找到 APK"
            exit 1
          fi

          cp \
            "$SOURCE_APK" \
            "$OUTPUT_APK"

          echo
          echo "======================================"
          echo "星番屋 AniBaka 可见测试 APK 构建完成"
          echo "======================================"
          echo

          ls -lh \
            "$OUTPUT_APK"

          sha256sum \
            "$OUTPUT_APK"

      - name: 上传 AniBaka 可见测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: XingFanWu-AniBaka-Visible-Preview
          path: build/app/outputs/flutter-apk/XingFanWu-AniBaka-Visible-Preview.apk
          if-no-files-found: error
          retention-days: 7

      - name: 上传 AniBaka 规则索引
        uses: actions/upload-artifact@v4
        with:
          name: XingFanWu-AniBaka-Manifest
          path: assets/anibaka/manifest.json
          if-no-files-found: error
          retention-days: 7
