name: AniBaka 兼容性测试 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-anibaka:
    name: 构建 AniBaka 兼容性测试版
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出星番屋源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: 下载 AniBaka 规则库
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/AniBakaRule

          git clone \
            --depth=1 \
            https://github.com/AniBakaBaka/AniBakaRule.git \
            /tmp/AniBakaRule

          echo "AniBaka 规则库下载完成"

          find /tmp/AniBakaRule \
            -maxdepth 1 \
            -name '*.json' \
            -type f \
            | sort

      - name: 检查 AniBaka 规则格式
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import json
          import collections

          root = Path("/tmp/AniBakaRule")

          rules = []
          operations = collections.Counter()

          for path in sorted(root.glob("*.json")):
              if path.name == "index.json":
                  continue

              try:
                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      f"[JSON错误] {path.name}: {exc}"
                  )
                  continue

              if not isinstance(data, dict):
                  continue

              if data.get("format") != "anx-rule/2":
                  continue

              rule_id = data.get(
                  "id",
                  path.stem,
              )

              rule_name = data.get(
                  "name",
                  rule_id,
              )

              rules.append(
                  {
                      "id": rule_id,
                      "name": rule_name,
                      "file": path.name,
                      "baseUrl": data.get(
                          "baseUrl",
                          "",
                      ),
                  }
              )

              def walk(value):
                  if isinstance(value, dict):
                      op = value.get("op")
                      if isinstance(op, str):
                          operations[op] += 1

                      for item in value.values():
                          walk(item)

                  elif isinstance(value, list):
                      for item in value:
                          walk(item)

              walk(data)

          print()
          print("==============================")
          print("AniBaka anx-rule/2 规则统计")
          print("==============================")
          print()

          print(
              f"识别到规则数量: {len(rules)}"
          )

          print()
          print("规则：")

          for rule in rules:
              print(
                  f"- {rule['name']} "
                  f"({rule['id']}) "
                  f"{rule['baseUrl']}"
              )

          print()
          print("发现的操作符：")

          for op, count in sorted(
              operations.items()
          ):
              print(
                  f"- {op}: {count}"
              )

          report_dir = Path(
              "build/anibaka-report"
          )

          report_dir.mkdir(
              parents=True,
              exist_ok=True,
          )

          report = {
              "format": "xingfanwu-anibaka-report/1",
              "ruleCount": len(rules),
              "rules": rules,
              "operations": dict(
                  sorted(
                      operations.items()
                  )
              ),
          }

          (
              report_dir /
              "compatibility-report.json"
          ).write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print()
          print(
              "兼容性报告生成完成"
          )
          PY

      - name: 创建 AniBaka assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            assets/anibaka/rules

          rm -f \
            assets/anibaka/rules/*.json

          cp \
            /tmp/AniBakaRule/*.json \
            assets/anibaka/rules/

          echo "规则已复制到："
          echo "assets/anibaka/rules"

          echo
          echo "文件数量："

          find \
            assets/anibaka/rules \
            -maxdepth 1 \
            -name '*.json' \
            -type f \
            | wc -l

      - name: 修改 pubspec 加入 AniBaka assets
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")

          text = path.read_text(
              encoding="utf-8"
          )

          asset_line = (
              "    - assets/anibaka/rules/\n"
          )

          if asset_line in text:
              print(
                  "AniBaka assets 已存在，无需重复添加"
              )
              raise SystemExit(0)

          marker = "  assets:\n"

          if marker not in text:
              raise SystemExit(
                  "pubspec.yaml 中没有找到 flutter/assets"
              )

          pos = text.index(marker)

          insert_pos = (
              text.find(
                  "\n",
                  pos + len(marker),
              )
          )

          if insert_pos == -1:
              raise SystemExit(
                  "无法定位 assets 区域"
              )

          text = (
              text[:insert_pos + 1]
              + asset_line
              + text[insert_pos + 1:]
          )

          path.write_text(
              text,
              encoding="utf-8",
          )

          print(
              "已添加 AniBaka assets"
          )
          PY

      - name: 创建 AniBaka 规则数据模型
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            lib/modules/anibaka

          cat > \
            lib/modules/anibaka/anibaka_rule.dart \
            <<'DART'
          class AniBakaRule {
            const AniBakaRule({
              required this.id,
              required this.name,
              required this.baseUrl,
              required this.description,
              required this.raw,
            });

            final String id;
            final String name;
            final String baseUrl;
            final String description;
            final Map<String, dynamic> raw;

            factory AniBakaRule.fromJson(
              Map<String, dynamic> json,
            ) {
              final format =
                  json['format']?.toString();

              if (format != 'anx-rule/2') {
                throw const FormatException(
                  '不是 anx-rule/2 规则',
                );
              }

              return AniBakaRule(
                id:
                    json['id']?.toString() ??
                    '',
                name:
                    json['name']?.toString() ??
                    '',
                baseUrl:
                    json['baseUrl']
                            ?.toString() ??
                        '',
                description:
                    json['description']
                            ?.toString() ??
                        '',
                raw: json,
              );
            }
          }
          DART

      - name: 创建 AniBaka 规则加载器
        shell: bash
        run: |
          set -euo pipefail

          cat > \
            lib/modules/anibaka/anibaka_rule_loader.dart \
            <<'DART'
          import 'dart:convert';

          import 'package:flutter/services.dart';

          import 'anibaka_rule.dart';

          class AniBakaRuleLoader {
            const AniBakaRuleLoader();

            static const _manifestAsset =
                'AssetManifest.json';

            Future<List<AniBakaRule>>
                loadBundledRules() async {
              final manifestText =
                  await rootBundle.loadString(
                _manifestAsset,
              );

              final manifest =
                  jsonDecode(
                manifestText,
              );

              if (manifest
                  is! Map<String, dynamic>) {
                return const [];
              }

              final ruleAssets =
                  manifest.keys
                      .where(
                        (path) =>
                            path.startsWith(
                              'assets/anibaka/rules/',
                            ) &&
                            path.endsWith(
                              '.json',
                            ) &&
                            !path.endsWith(
                              '/index.json',
                            ),
                      )
                      .toList()
                    ..sort();

              final rules =
                  <AniBakaRule>[];

              for (final asset
                  in ruleAssets) {
                try {
                  final raw =
                      await rootBundle
                          .loadString(
                    asset,
                  );

                  final decoded =
                      jsonDecode(
                    raw,
                  );

                  if (decoded
                      is! Map<String,
                          dynamic>) {
                    continue;
                  }

                  if (decoded['format']
                          ?.toString() !=
                      'anx-rule/2') {
                    continue;
                  }

                  rules.add(
                    AniBakaRule.fromJson(
                      decoded,
                    ),
                  );
                } catch (_) {
                  // 测试阶段跳过损坏规则，
                  // 不影响其他规则加载。
                }
              }

              return rules;
            }
          }
          DART

      - name: 创建 AniBaka 操作符扫描器
        shell: bash
        run: |
          set -euo pipefail

          cat > \
            lib/modules/anibaka/anibaka_operation_scanner.dart \
            <<'DART'
          class AniBakaOperationScanner {
            const AniBakaOperationScanner();

            Set<String> scan(
              Map<String, dynamic> rule,
            ) {
              final result = <String>{};

              void walk(dynamic value) {
                if (value is Map) {
                  final op = value['op'];

                  if (op is String &&
                      op.isNotEmpty) {
                    result.add(op);
                  }

                  for (final child
                      in value.values) {
                    walk(child);
                  }
                } else if (value is List) {
                  for (final child in value) {
                    walk(child);
                  }
                }
              }

              walk(rule);

              return result;
            }
          }
          DART

      - name: 创建 AniBaka 兼容状态
        shell: bash
        run: |
          set -euo pipefail

          cat > \
            lib/modules/anibaka/anibaka_compatibility.dart \
            <<'DART'
          enum AniBakaSupportLevel {
            supported,
            partial,
            unsupported,
          }

          class AniBakaCompatibility {
            const AniBakaCompatibility({
              required this.level,
              required this.unsupportedOps,
            });

            final AniBakaSupportLevel level;
            final Set<String> unsupportedOps;
          }

          class AniBakaCompatibilityChecker {
            const AniBakaCompatibilityChecker();

            // 第一阶段只声明通用基础操作。
            //
            // 不把特殊站点解析器假装成已实现。
            static const supportedOps = {
              'fetch',
              'follow',
              'replace',
              'first',
            };

            AniBakaCompatibility check(
              Set<String> operations,
            ) {
              final unsupported =
                  operations
                      .difference(
                        supportedOps,
                      );

              if (unsupported.isEmpty) {
                return const AniBakaCompatibility(
                  level:
                      AniBakaSupportLevel
                          .supported,
                  unsupportedOps: {},
                );
              }

              if (unsupported.length <
                  operations.length) {
                return AniBakaCompatibility(
                  level:
                      AniBakaSupportLevel
                          .partial,
                  unsupportedOps:
                      unsupported,
                );
              }

              return AniBakaCompatibility(
                level:
                    AniBakaSupportLevel
                        .unsupported,
                unsupportedOps:
                    unsupported,
              );
            }
          }
          DART

      - name: 创建 AniBaka 模块测试
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            test/anibaka

          cat > \
            test/anibaka/anibaka_rule_test.dart \
            <<'DART'
          import 'package:flutter_test/flutter_test.dart';

          import 'package:kazumi/modules/anibaka/anibaka_operation_scanner.dart';
          import 'package:kazumi/modules/anibaka/anibaka_rule.dart';

          void main() {
            test(
              'can parse anx-rule/2 rule',
              () {
                final rule =
                    AniBakaRule.fromJson(
                  {
                    'format':
                        'anx-rule/2',
                    'id': 'demo',
                    'name': 'Demo',
                    'baseUrl':
                        'https://example.com',
                    'description':
                        'demo rule',
                    'search': [
                      {
                        'op': 'fetch',
                        'url':
                            '/search?q={keyword}',
                      },
                    ],
                  },
                );

                expect(
                  rule.id,
                  'demo',
                );

                expect(
                  rule.name,
                  'Demo',
                );
              },
            );

            test(
              'can scan rule operations',
              () {
                const scanner =
                    AniBakaOperationScanner();

                final operations =
                    scanner.scan(
                  {
                    'search': [
                      {
                        'op': 'fetch',
                      },
                      {
                        'op':
                            'jsonSeries',
                      },
                    ],
                    'play': [
                      {
                        'op': 'follow',
                      },
                    ],
                  },
                );

                expect(
                  operations,
                  contains('fetch'),
                );

                expect(
                  operations,
                  contains(
                    'jsonSeries',
                  ),
                );

                expect(
                  operations,
                  contains('follow'),
                );
              },
            );
          }
          DART

      - name: 格式化新增代码
        run: |
          dart format \
            lib/modules/anibaka \
            test/anibaka

      - name: 安装 Flutter 依赖
        run: |
          flutter pub get

      - name: 运行 AniBaka 单元测试
        run: |
          flutter test \
            test/anibaka

      - name: 静态检查 AniBaka 模块
        run: |
          flutter analyze \
            lib/modules/anibaka \
            test/anibaka \
            --no-fatal-infos

      - name: 构建 AniBaka 测试 APK
        run: |
          flutter build apk \
            --debug

      - name: 准备测试 APK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="build/app/outputs/flutter-apk/app-debug.apk"

          OUTPUT_APK="build/app/outputs/flutter-apk/XingFanWu-AniBaka-Preview.apk"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::没有找到 Debug APK"
            exit 1
          fi

          cp \
            "$SOURCE_APK" \
            "$OUTPUT_APK"

          echo
          echo "===================================="
          echo "AniBaka 测试 APK 构建完成"
          echo "===================================="
          echo

          ls -lh \
            "$OUTPUT_APK"

          sha256sum \
            "$OUTPUT_APK"

      - name: 上传 AniBaka 测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: XingFanWu-AniBaka-Preview
          path: build/app/outputs/flutter-apk/XingFanWu-AniBaka-Preview.apk
          if-no-files-found: error
          retention-days: 7

      - name: 上传 AniBaka 兼容性报告
        uses: actions/upload-artifact@v4
        with:
          name: XingFanWu-AniBaka-Compatibility-Report
          path: build/anibaka-report/
          if-no-files-found: error
          retention-days: 7
