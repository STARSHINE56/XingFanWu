name: 星番屋一键品牌化并构建 APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "星番屋版本号，例如 1.0.0"
        required: true
        default: "1.0.0"
      build_number:
        description: "内部版本号，例如 1"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  rebrand-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: 检查品牌图标
        shell: bash
        run: |
          set -e
          if [ ! -f "branding/xingfanwu_icon.png" ]; then
            echo "::error::缺少 branding/xingfanwu_icon.png"
            echo "请把星番屋图标上传到仓库 branding/xingfanwu_icon.png 后重新运行。"
            exit 1
          fi

      - name: 一键品牌化
        env:
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        shell: python
        run: |
          from pathlib import Path
          import os
          import re
          import shutil

          APP_NAME = "星番屋"
          APP_ID = "com.starshine.xingfanwu"
          REPO = "https://github.com/STARSHINE56/XingFanWu"
          VERSION = os.environ["APP_VERSION"].strip()
          BUILD = os.environ["BUILD_NUMBER"].strip()

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          # Android 显示名
          path = "android/app/src/main/AndroidManifest.xml"
          text = read(path).replace('android:label="Kazumi"', 'android:label="星番屋"')
          write(path, text)

          # Android applicationId / namespace
          path = "android/app/build.gradle"
          text = read(path)
          text = re.sub(r'namespace\s+"[^"]+"', f'namespace "{APP_ID}"', text, count=1)
          text = re.sub(r'applicationId\s+"[^"]+"', f'applicationId "{APP_ID}"', text, count=1)
          write(path, text)

          # MainActivity 包路径；MethodChannel 名称保留，避免 Dart 端失配
          old_activity = Path("android/app/src/main/kotlin/com/example/kazumi/MainActivity.kt")
          new_activity = Path("android/app/src/main/kotlin/com/starshine/xingfanwu/MainActivity.kt")
          if old_activity.exists():
              text = old_activity.read_text(encoding="utf-8")
              text = text.replace("package com.example.kazumi", "package com.starshine.xingfanwu", 1)
              new_activity.parent.mkdir(parents=True, exist_ok=True)
              new_activity.write_text(text, encoding="utf-8")
              old_activity.unlink()
          elif new_activity.exists():
              text = new_activity.read_text(encoding="utf-8")
              text = re.sub(r"^package\s+\S+", "package com.starshine.xingfanwu", text, count=1, flags=re.M)
              new_activity.write_text(text, encoding="utf-8")
          else:
              raise RuntimeError("未找到 MainActivity.kt")

          # 版本号
          path = "pubspec.yaml"
          text = read(path)
          text = re.sub(r"(?m)^version:\s*.+$", f"version: {VERSION}+{BUILD}", text, count=1)

          # Android-only 图标配置
          text = text.replace("  ios: true\n", "  ios: false\n", 1)
          text = re.sub(r'(?m)^  adaptive_icon_background:.*$', '  adaptive_icon_background: "#0B1E5B"', text, count=1)
          text = re.sub(
              r'(?ms)^  macos:\n    generate: true\n    image_path: assets/images/logo/logo_rounded\.png\n',
              '',
              text,
          )
          text = re.sub(
              r'(?ms)^  windows:\n    generate: true\n    image_path: assets/images/logo/logo_rounded\.png\n    icon_size: 256\n',
              '',
              text,
          )
          write(path, text)

          # 星番屋图标
          shutil.copyfile("branding/xingfanwu_icon.png", "assets/images/logo/logo_android.png")
          shutil.copyfile("branding/xingfanwu_icon.png", "assets/images/logo/logo_rounded.png")

          # 用户可见品牌文字
          replacements = {
              "lib/app_widget.dart": [
                  ('title: "Kazumi"', 'title: "星番屋"'),
                  ("setToolTip('Kazumi')", "setToolTip('星番屋')"),
                  ("label: '退出 Kazumi'", "label: '退出 星番屋'"),
              ],
              "lib/pages/about/about_page.dart": [
                  ("'Kazumi'", "'星番屋'"),
              ],
              "lib/pages/onboarding/steps/disclaimer_step.dart": [
                  ("title: '欢迎来到 Kazumi'", "title: '欢迎来到 星番屋'"),
              ],
              "lib/pages/route_error_page.dart": [
                  ("Text('Kazumi')", "Text('星番屋')"),
              ],
              "lib/pages/index_module.dart": [
                  ("Text('Kazumi')", "Text('星番屋')"),
              ],
              "lib/pages/settings/settings_module.dart": [
                  ("applicationName: 'Kazumi'", "applicationName: '星番屋'"),
                  ("applicationLegalese: 'Kazumi · GNU General Public License v3.0'",
                   "applicationLegalese: '星番屋 · GNU General Public License v3.0'"),
              ],
              "lib/pages/settings/interface_settings.dart": [
                  ("'退出 Kazumi'", "'退出 星番屋'"),
              ],
              "lib/bean/dialog/exit_confirmation_dialog.dart": [
                  ("'关闭 Kazumi？'", "'关闭 星番屋？'"),
                  ("'退出 Kazumi'", "'退出 星番屋'"),
              ],
          }

          for p, pairs in replacements.items():
              fp = Path(p)
              if not fp.exists():
                  continue
              text = fp.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              fp.write_text(text, encoding="utf-8")

          # Android fastlane 标题
          title_file = Path("fastlane/metadata/android/zh-CN/title.txt")
          if title_file.exists():
              title_file.write_text("星番屋\n", encoding="utf-8")

          # 自己的项目主页 / 更新 / Issue
          path = "lib/request/config/api_endpoints.dart"
          text = read(path)
          text = text.replace(
              'static const String projectUrl = "https://kazumi.app/";',
              f'static const String projectUrl = "{REPO}";'
          )
          text = text.replace(
              'static const String sourceUrl = "https://github.com/Predidit/Kazumi";',
              f'static const String sourceUrl = "{REPO}";'
          )
          text = text.replace(
              "'https://api.github.com/repos/Predidit/Kazumi/releases/latest';",
              "'https://api.github.com/repos/STARSHINE56/XingFanWu/releases/latest';"
          )
          write(path, text)

          # About 页移除原 Telegram 项
          p = Path("lib/pages/about/about_page.dart")
          if p.exists():
              text = p.read_text(encoding="utf-8")
              start = text.find("                    AboutLinkTile(\n                      icon: Icons.forum_rounded,")
              if start != -1:
                  end = text.find("                    ),", start)
                  if end != -1:
                      end += len("                    ),")
                      text = text[:start] + text[end:]
              p.write_text(text, encoding="utf-8")

          # 致谢页移除旧图标作者项
          p = Path("lib/pages/about/credits_page.dart")
          if p.exists():
              text = p.read_text(encoding="utf-8")
              start = text.find("                AboutLinkTile(\n                  icon: Icons.brush_rounded,")
              if start != -1:
                  end = text.find("                ),", start)
                  if end != -1:
                      end += len("                ),")
                      text = text[:start] + text[end:]
              p.write_text(text, encoding="utf-8")

          # User-Agent 改成自己的项目
          p = Path("lib/utils/constants.dart")
          if p.exists():
              text = p.read_text(encoding="utf-8")
              text = text.replace(
                  "Predidit/Kazumi/${ApiEndpoints.version} (Android) (https://github.com/Predidit/Kazumi)",
                  "STARSHINE56/XingFanWu/${ApiEndpoints.version} (Android) (https://github.com/STARSHINE56/XingFanWu)"
              )
              p.write_text(text, encoding="utf-8")

          print(f"完成：{APP_NAME} {VERSION}+{BUILD} / {APP_ID}")

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 生成 Android 图标
        run: dart run flutter_launcher_icons

      - name: 格式化 Dart
        run: |
          dart format             lib/app_widget.dart             lib/pages/about/about_page.dart             lib/pages/about/credits_page.dart             lib/pages/onboarding/steps/disclaimer_step.dart             lib/pages/route_error_page.dart             lib/pages/index_module.dart             lib/pages/settings/settings_module.dart             lib/pages/settings/interface_settings.dart             lib/bean/dialog/exit_confirmation_dialog.dart             lib/request/config/api_endpoints.dart             lib/utils/constants.dart

      - name: 扫描用户可见 Kazumi 残留
        shell: bash
        run: |
          set -e
          if grep -RInE             --include='*.dart'             --include='AndroidManifest.xml'             --include='title.txt'             "欢迎来到 Kazumi|关闭 Kazumi|退出 Kazumi|Text\(['\"]Kazumi['\"]\)|title:[[:space:]]*['\"]Kazumi['\"]|android:label=\"Kazumi\""             lib android/app/src/main fastlane/metadata/android/zh-CN 2>/dev/null; then
            echo "::error::仍发现用户可见的 Kazumi 文案"
            exit 1
          fi
          echo "品牌扫描通过"

      - name: Flutter 静态检查
        run: flutter analyze

      - name: 构建 Android Release APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: XingFanWu-${{ inputs.version }}-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 提交改动回 main
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml pubspec.lock android/app assets/images/logo lib fastlane/metadata/android/zh-CN/title.txt

          if git diff --cached --quiet; then
            echo "没有需要提交的改动"
            exit 0
          fi

          git commit -m "品牌化为星番屋 v${{ inputs.version }}"
          git push origin HEAD:main
