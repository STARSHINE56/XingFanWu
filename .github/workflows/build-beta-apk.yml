name: 星番屋测试版 APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.0-beta.1"
        required: true
        default: "1.1.0-beta.1"
        type: string

      build_number:
        description: "内部版本号，例如 3"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  build-beta:
    name: 构建星番屋测试版 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: 检查版本号
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式不正确：$APP_VERSION"
            echo "示例：1.1.0-beta.1"
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number 必须是整数"
            exit 1
          fi

          echo "测试版本号：$APP_VERSION"
          echo "内部版本号：$BUILD_NUMBER"

      - name: 临时转换为测试版应用
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          manifest = Path("android/app/src/main/AndroidManifest.xml")

          gradle_text = gradle.read_text(encoding="utf-8")

          old_namespace = 'namespace "com.starshine.xingfanwu"'
          new_namespace = 'namespace "com.starshine.xingfanwu.beta"'

          old_app_id = 'applicationId "com.starshine.xingfanwu"'
          new_app_id = 'applicationId "com.starshine.xingfanwu.beta"'

          if old_namespace not in gradle_text:
              raise RuntimeError(
                  "没有找到原 namespace，停止构建，避免错误修改"
              )

          if old_app_id not in gradle_text:
              raise RuntimeError(
                  "没有找到原 applicationId，停止构建，避免错误修改"
              )

          gradle_text = gradle_text.replace(
              old_namespace,
              new_namespace,
              1,
          )

          gradle_text = gradle_text.replace(
              old_app_id,
              new_app_id,
              1,
          )

          gradle.write_text(
              gradle_text,
              encoding="utf-8",
          )

          manifest_text = manifest.read_text(encoding="utf-8")

          old_label = 'android:label="星番屋"'
          new_label = 'android:label="星番屋测试版"'

          if old_label not in manifest_text:
              raise RuntimeError(
                  "没有找到原应用名称，停止构建"
              )

          manifest_text = manifest_text.replace(
              old_label,
              new_label,
              1,
          )

          manifest.write_text(
              manifest_text,
              encoding="utf-8",
          )

          print("已临时修改为测试版：")
          print("应用名：星番屋测试版")
          print("applicationId：com.starshine.xingfanwu.beta")
          print("namespace：com.starshine.xingfanwu.beta")
          PY

      - name: 验证测试版临时配置
        shell: bash
        run: |
          set -euo pipefail

          echo "检查 applicationId..."
          grep -n \
            'applicationId "com.starshine.xingfanwu.beta"' \
            android/app/build.gradle

          echo "检查 namespace..."
          grep -n \
            'namespace "com.starshine.xingfanwu.beta"' \
            android/app/build.gradle

          echo "检查应用名称..."
          grep -n \
            'android:label="星番屋测试版"' \
            android/app/src/main/AndroidManifest.xml

          echo "测试版临时配置检查通过。"

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 生成 Android 图标
        run: dart run flutter_launcher_icons

      - name: 运行更新模块测试
        run: flutter test test/xingfanwu_update_test.dart

      - name: Flutter 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 构建测试版 APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --debug \
            --build-name "${{ inputs.version }}" \
            --build-number "${{ inputs.build_number }}"

      - name: 检查 APK 是否生成
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::没有找到 app-debug.apk"
            exit 1
          fi

          echo "测试 APK 构建成功："
          ls -lh "$APK"

      - name: 验证测试 APK 信息
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$AAPT" ]; then
            echo "::error::找不到 aapt"
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"

          PACKAGE="$(
            echo "$BADGING" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          VERSION="$(
            echo "$BADGING" \
              | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p"
          )"

          LABEL="$(
            echo "$BADGING" \
              | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" \
              | head -n 1
          )"

          echo "applicationId：$PACKAGE"
          echo "versionName：$VERSION"
          echo "应用名称：$LABEL"

          if [ "$PACKAGE" != "com.starshine.xingfanwu.beta" ]; then
            echo "::error::测试版 applicationId 不正确：$PACKAGE"
            exit 1
          fi

          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::测试版 versionName 不正确"
            echo "预期：$EXPECTED_VERSION"
            echo "实际：$VERSION"
            exit 1
          fi

          echo "测试 APK 信息验证通过。"

      - name: 重命名测试 APK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="build/app/outputs/flutter-apk/app-debug.apk"

          OUTPUT="build/app/outputs/flutter-apk/XingFanWu-v${{ inputs.version }}-beta.apk"

          cp "$SOURCE" "$OUTPUT"

          echo "最终测试 APK："
          ls -lh "$OUTPUT"

      - name: 计算 APK SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/XingFanWu-v${{ inputs.version }}-beta.apk"

          echo "APK SHA-256："
          sha256sum "$APK"

      - name: 确认正式源码未被提交
        shell: bash
        run: |
          set -euo pipefail

          echo "以下修改仅存在于 GitHub Actions 临时环境："
          git status --short

          echo ""
          echo "不会执行 git commit 或 git push。"
          echo "工作流结束后这些临时修改会自动消失。"

      - name: 上传测试版 APK
        uses: actions/upload-artifact@v4
        with:
          name: XingFanWu-${{ inputs.version }}-android-beta
          path: build/app/outputs/flutter-apk/XingFanWu-v${{ inputs.version }}-beta.apk
          if-no-files-found: error
          retention-days: 14
